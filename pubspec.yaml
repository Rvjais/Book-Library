name: libready
description: "LibReady - a private, offline library and reader for PDF and EPUB books."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  file_picker: ^13.3.2
  archive: ^4.6.0
  xml: ^7.1.0
  html: ^0.15.7
  crypto: ^3.0.8
  image: ^4.12.0
  shared_preferences: ^2.5.6
  meta: ^1.11.0
  pdfrx: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
